name: azure-openai
# Matches /openai/deployments/{deployment-id}/chat/completions or /embeddings
matcher: "/openai/deployments/.*/(chat/completions|embeddings)"
request_mapping:
  # Azure has no model in the body; real Azure reports the deployment's model.
  model: "{{ json.model | default(value='gpt-4o-2024-08-06') }}"
stream:
  enabled: true
  frame_format: raw
  # Same wire shape as OpenAI: content chunks, a finish_reason chunk, an
  # optional usage chunk (stream_options.include_usage), then [DONE].
  lifecycle:
    on_chunk:
      template_body: 'data: {% include "openai/stream_chunk.json.j2" %}'
    on_stop:
      template_path: "openai/stream_stop.sse.j2"
response_template: "openai/chat_completion.json.j2"
