name: "bedrock-converse"
matcher: "^/model/.*/(converse|converse-stream)$"
request_mapping:
  prompt: "{{ json.messages.0.content.0.text }}"
response_template: "bedrock/converse.json.j2"
stream:
  enabled: true
  # ConverseStream: typed AWS events (messageStart, contentBlockDelta,
  # contentBlockStop, messageStop, metadata) with plain JSON payloads.
  encoding: "aws-event-stream"
  aws_payload: "json"
  lifecycle:
    on_start:
      template_body: |
        event: messageStart
        data: {"role":"assistant"}
    on_chunk:
      template_body: |
        event: contentBlockDelta
        data: {"contentBlockIndex":0,"delta":{"text":{{ chunk | json_encode() }}}}
    on_stop:
      template_body: |
        event: contentBlockStop
        data: {"contentBlockIndex":0}

        event: messageStop
        data: {"stopReason":"end_turn"}

        event: metadata
        data: {"usage":{"inputTokens":10,"outputTokens":{{ chunk_count }},"totalTokens":{{ 10 + chunk_count }}},"metrics":{"latencyMs":150}}
