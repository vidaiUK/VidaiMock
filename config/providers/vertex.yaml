name: vertex
# Vertex AI endpoint pattern:
# /v1/projects/{project}/locations/{location}/publishers/google/models/{model}:generateContent
# Matcher captures both project, location, and model
matcher: "^/v1/projects/[^/]+/locations/[^/]+/publishers/google/models/[^:]+:(generate|streamGenerate)Content$"
stream:
  enabled: true
  # Same wire shape as Gemini streamGenerateContent?alt=sse: text-only chunks,
  # then one final chunk with finishReason + usageMetadata. No [DONE] — Gemini
  # and Vertex never send one.
  lifecycle:
    on_chunk:
      template_path: "gemini/stream_chunk.json.j2"
    on_stop:
      template_path: "gemini/stream_final.json.j2"
response_template: "vertex/response.json.j2"
